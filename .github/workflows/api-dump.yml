name: ApiDump

# Throwaway workflow: prints the names and signatures of some game types, so the mod is written against the real API.
on:
  push:
    branches: [api-dump]
  workflow_dispatch:

jobs:
  dump:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore the game libraries
        run: dotnet restore src/Amodus/Amodus.csproj

      - name: Build the dump tool
        run: dotnet build tools/ApiDump -c Release

      - name: Dump the API
        shell: pwsh
        run: |
          $d = (Get-ChildItem "$env:USERPROFILE\.nuget\packages\amongus.gamelibs.steam" -Recurse -Filter UnityEngine.IMGUIModule.dll | Select-Object -First 1).DirectoryName
          Write-Host "#### DIR $d"
          dotnet run --no-build --project tools/ApiDump -c Release -- $d `
            t:GUIStyleState t:RectOffset t:EventType t:TextAnchor t:FontStyle t:TextClipping t:Texture t:GUIUtility
